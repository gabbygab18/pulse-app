name: Build desktop app

# Unsigned builds for Windows + macOS. Runs on a version tag (v1.2.3) and can be
# triggered by hand. Artifacts are attached to the run; on a tag they're also
# published to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Needed so the release step can upload assets with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            out: dist/*.exe
          - os: macos-latest
            cmd: npm run dist:mac
            out: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No signing identity in CI → build unsigned.
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: isla-tracker-${{ matrix.os }}
          path: ${{ matrix.out }}
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
